<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>✦ Sealed Grimoire — Unlocked</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* 全局重置 & 锁定阶段的样式 — 解锁后会被覆盖或重新定义，但保证滚动条基础可用 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* 登录背景与容器样式 —— 这些在解锁后会保留背景定义但不会破坏内部滚动 */
        body {
            background: #140624;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Cinzel', Georgia, serif;
            cursor: default;
            /* 关键修复：移除全局 overflow:hidden，但仍保留 flex 居中 */
            overflow: auto;
            margin: 0;
            padding: 0;
        }

        /* 保证 html 也可以自由滚动，避免任何隐藏滚动条的声明 */
        html {
            overflow: auto;
            height: 100%;
        }

        .login-background {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background:
                radial-gradient(ellipse at 30% 20%, rgba(100, 50, 140, 0.4) 0%, transparent 55%),
                radial-gradient(ellipse at 70% 60%, rgba(60, 30, 110, 0.35) 0%, transparent 55%),
                radial-gradient(ellipse at 40% 80%, rgba(130, 80, 170, 0.3) 0%, transparent 50%);
            z-index: 0;
            pointer-events: none;
        }

        .login-box {
            position: relative;
            z-index: 1;
            background: rgba(20, 6, 36, 0.7);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(212, 168, 83, 0.5);
            border-radius: 24px;
            padding: 3rem 2.5rem;
            text-align: center;
            box-shadow: 0 0 60px rgba(160, 120, 200, 0.4);
            width: 90%;
            max-width: 420px;
            margin: 2rem auto;
        }

        .login-box h2 {
            color: #e8c97a;
            font-weight: 600;
            letter-spacing: 0.08em;
            margin-bottom: 2rem;
            text-shadow: 0 0 15px rgba(232,201,122,0.7);
            font-size: 1.6rem;
        }

        .login-box input {
            width: 100%;
            padding: 14px 20px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(180,150,210,0.5);
            border-radius: 30px;
            color: #e8c97a;
            font-family: 'Cinzel', serif;
            font-size: 1rem;
            letter-spacing: 0.05em;
            text-align: center;
            outline: none;
            transition: all 0.3s;
        }

        .login-box input:focus {
            border-color: #e8c97a;
            box-shadow: 0 0 20px rgba(232,201,122,0.5);
        }

        .login-box button {
            margin-top: 1.8rem;
            background: transparent;
            border: 1px solid #e8c97a;
            color: #e8c97a;
            padding: 12px 36px;
            font-family: 'Cinzel', serif;
            font-size: 0.9rem;
            letter-spacing: 0.12em;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
        }

        .login-box button:hover {
            background: rgba(232,201,122,0.15);
            box-shadow: 0 0 25px rgba(232,201,122,0.6);
        }

        .error {
            color: #c0a0a0;
            font-size: 0.8rem;
            margin-top: 1rem;
            display: none;
        }

        .error.show {
            display: block;
        }

        /* 保障即使在未解锁阶段，如果内容过多（虽然不会）也能滚动 —— 以防万一 */
        body {
            overflow-y: auto;
        }
    </style>
</head>
<body>
    <div class="login-background"></div>
    <div class="login-box" id="loginBox">
        <h2>✦ Speak the Word ✦</h2>
        <input type="password" id="passwordInput" placeholder="Enter the password" autocomplete="off" />
        <button id="unlockBtn">Unseal Grimoire</button>
        <div class="error" id="errorMsg">The seal remains unbroken…</div>
    </div>

            const passwordInput = document.getElementById('passwordInput');
            const unlockBtn = document.getElementById('unlockBtn');
            const errorMsg = document.getElementById('errorMsg');

            // 核心解锁 + 强制启用滚动条
            function tryDecrypt() {
                const password = passwordInput.value.trim();
                if (!password) return;

                if (password !== 'wry') {
                    errorMsg.classList.add('show');
                    passwordInput.value = '';
                    return;
                }

                try {
                    const bytes = CryptoJS.AES.decrypt(encryptedWry, password);
                    const decrypted = bytes.toString(CryptoJS.enc.Utf8);
                    if (!decrypted || decrypted.indexOf('<html') === -1) {
                        throw new Error('Incorrect password or corrupt data');
                    }

                    // 替换整个 body 内容
                    document.body.innerHTML = decrypted;

                    // ========= 修复滚动条问题 =========
                    // 强制移除任何可能导致滚动锁定的样式
                    document.documentElement.style.overflow = 'auto';
                    document.documentElement.style.height = 'auto';
                    document.body.style.overflow = 'auto';
                    document.body.style.height = 'auto';
                    // 如果存在任何 class 或 id 引起的隐藏滚动条, 也保证可见
                    document.body.style.minHeight = '100vh';
                    // 确保任何 position fixed 的元素不干扰滚动
                    document.documentElement.style.position = 'static';
                    document.body.style.position = 'relative';
                    // 重新加载所有脚本（保持原始功能完整性）
                    const scripts = document.querySelectorAll('script');
                    scripts.forEach(oldScript => {
                        const newScript = document.createElement('script');
                        Array.from(oldScript.attributes).forEach(attr => {
                            newScript.setAttribute(attr.name, attr.value);
                        });
                        newScript.textContent = oldScript.textContent;
                        oldScript.parentNode.replaceChild(newScript, oldScript);
                    });

                    // 额外保险: 监听新内容中可能的内联样式覆盖，但通常上述强制覆盖已经足够
                } catch (e) {
                    errorMsg.classList.add('show');
                    passwordInput.value = '';
                }
            }

            unlockBtn.addEventListener('click', tryDecrypt);
            passwordInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') tryDecrypt();
            });

            // 初始化时也确保登录界面本身可滚动（虽然内容高度很小但保留特性）
            window.addEventListener('load', () => {
                document.documentElement.style.overflow = 'auto';
                document.body.style.overflow = 'auto';
            });
        })();
    </script>
</body>
</html>
