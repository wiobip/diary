                        <div class="tab-panel" id="panel-meditation">

                                <button class="sub-tab-btn active" data-subtab="week1"><span class="sub-tab-icon">🌑</span> Week 1</button>

                            <div class="sub-panel active" id="sub-panel-week1">
                                <article class="day-entry"><div class="day-header"><span class="day-date">May 17</span><span class="day-status status-not">meditation not done</span><span class="day-divider"></span></div><div class="day-tldr"><span class="tldr-icon">✦</span><span class="tldr-text">Day of the call, no meditation — just tuned in on the new moon and first day of my cycle.</span></div><div class="day-text"><p>The day of our call. Interesting that it's day 1 of the program, a new moon, and day 1 of my menstrual cycle. I didn't start practicing that day, just tuned in.</p></div></article>
                                <article class="day-entry"><div class="day-header"><span class="day-date">May 18</span><span class="day-status status-done">meditation done</span><span class="day-divider"></span></div><div class="day-tldr"><span class="tldr-icon">✦</span><span class="tldr-text">First real meditation after a long break: struggled with the inner "journalist" and timer anxiety, but reached 30 minutes with a brief deep trance.</span></div><div class="day-text"><p>This is a meditation after a pretty long break. There were 2 attempts. In the 1st one I was shocked at how loud the world around me was and got super irritated (even though I live in a quiet apartment in a quiet neighborhood), couldn't continue.</p><p>The second one actually worked and I did 30 minutes. I was in a deep trance for about 5–7 minutes. The main difficulty — I kept thinking about the diary and what to write down, almost every moment was like "and this moment I'll describe in the diary like this." I tried to negotiate with the "journalist," convince him that I wouldn't write anything except "sat for 30 minutes" so he'd shut up, but he only believed me for about 5 minutes and then carried on again.</p><p>I worried that something was wrong with the timer and that I'd meditate for longer than I should, checked the time once during the meditation (but at least it was a cool time — 1:11, and because of that I was a little less upset at my weakness). I got irritated that I was concentrating way too hard on the breath, on the belly movement, it was against my will, and I thought the whole point of this meditation was not to get stuck on anything, breath included.</p><p>Towards the end of the meditation (the last 5 minutes or so) some random thoughts started coming. They were neutral, just some nonsense, but I was even surprised that this stuff was getting into my head and I was catching and stopping it pretty late. By then it was already half-sleep. And to be more honest, I stayed there out of laziness because it was easier to spend the last minutes that I already didn't like that way.</p></div></article>
                                <article class="day-entry"><div class="day-header"><span class="day-date">May 19</span><span class="day-status status-not">meditation not done</span><span class="day-divider"></span></div><div class="day-tldr"><span class="tldr-icon">✦</span><span class="tldr-text">Only 15 minutes; perfectionism about technique vs. familiar "vibrations" made me quit — decided to wait for mentor feedback.</span></div><div class="day-text"><p>This meditation only lasted 15 minutes. I meditated during the day and was planning to just do a new session in the evening for 30 minutes, since that time I'd cut it short. But because of perfectionism I couldn't, and I also couldn't fall asleep properly that day, only towards morning.</p><p>The perfectionism goes like this: during meditation I'm used to tuning into some kind of "vibration" and kind of dissolving into it (in practice it feels like various subtle, quiet sounds — several of them, around 1 to 5 — which you can't hear in an ordinary state; if you catch one and stay with it, it's easy to slip into a trance). I was in a trance, but then I thought that tuning into this vibration and being in that trance is cheating, because there's not much difference between getting stuck on a thought and getting stuck on a vibration. So I decided to meditate without it, and that already felt a bit like torture — this, by the way, is what made the 1st attempt cut off at 15 minutes.</p><p>I managed to stop the first strong impulse to quit, a couple of minutes passed, the second one came, and I didn't have the strength to stop it. In the end I got confused about how I'm supposed to meditate and what's even required of me. I decided, until I get your feedback this week, to just keep meditating the way I usually do.</p><p>Also, I meditate with my eyes closed. I know you're supposed to do it with them open, but I've almost never done it that way before and I'm a bit afraid of it because of the presumed difficulty, so I haven't even tried + I remember Diana said she did the program with her eyes closed and that it's fine. I decided not to think about it until your feedback.</p></div></article>
                                <article class="day-entry"><div class="day-header"><span class="day-date">May 20</span><span class="day-status status-done">meditation done</span><span class="day-divider"></span></div><div class="day-tldr"><span class="tldr-icon">✦</span><span class="tldr-text">Meditation done despite a broken timer and inner journalist; noticed how I entertain myself during practice — need guidance.</span></div><div class="day-text"><p>I decided to do it without much perfectionism, because I got scared that I wouldn't be able to start at all because of it. It's fairly easy for me to stay still, except that sometimes I want to swallow saliva and sometimes the breath itself gets too pronounced and there's movement in the chest and belly.</p><p>The hardest part was that again, somewhere after 15–20 minutes, there was a compulsive urge to check the time and I gave in, like 3 times in this final part of the meditation (by the way, the timer really was broken, or rather, the laptop with it ran out of battery and turned off). The "journalist" was back, but way less intrusive and he hardly irritated me. He wanted to write down all sorts of successful and cool moments from the meditation into the diary, like to show off.</p><p>In this meditation I remembered a post by an acquaintance of mine, he invented the "smack" technique: during meditation you mentally kiss the phenomena that distract you. I guess it helped me a little, at least it's better than putting them down. No deep trance happened this time. Before the next meditation I'll try to work through this pattern — that I compulsively want to check the time and worry that the timer is broken, set wrong, etc.</p><p>I also noticed that already in the second part of the meditation I was trying to entertain myself with meditative stuff, like moving energies through the body, feeling an energy field around me, etc., it was fun, but I noticed it pretty quickly and stopped doing it — for me that's also cheating.</p></div><div class="reflection-block"><span class="reflection-label">/ intermediate reflection /</span><p>So basically, it seems I really need feedback from the mentor, my problems right now are because I apparently don't understand what the program requires. Usually in my meditations there is no goal, so I just hang out in "vibrations," but that doesn't seem to train my mind and the program is definitely not for that.</p><p>I also remembered a moment from the past that once changed my practice — it was a vipassana retreat, where for the first 2 days I was suffering, but then the teacher said "actually, meditation should bring pleasure," and overall that phrase was a revelation for me, and it was enough for meditation to start bringing me pleasure, including at that vipassana retreat (but honestly I was breaking the vipassana rules in terms of meditation technique to do that, I was looking for entertaining moments in meditation for myself, partly as a kind of protest against Buddhism — it wasn't a Goenka retreat, it was right in a temple with mantras, etc.), I didn't even want to get out of meditation and leave the retreat. That was many years ago. And now I'm consciously removing the things that bring pleasure in meditation. In short, I'm just confused.</p></div></article>
                                <article class="day-entry"><div class="day-header"><span class="day-date">May 21</span><span class="day-status status-done">meditation done</span><span class="day-divider"></span></div><div class="day-text"><p>My only goal was — not to look at the timer even once. And I did it. It was a good, easy meditation, closer to what I expected of myself in the previous days. Without the nerves I had in the first 3 days. And the meditative state came not from concentrating on the "vibration," but from something else. It was more like concentrating on emptiness, dissolving into emptiness, I don't know. And concentrating on the inner sound would have even thrown me off. At some point there was even a subjective dissolution of the body. But it wasn't a full-on deep trance.</p><p>As for small compulsions in this meditation — at the beginning I really wanted to hallucinate (watch pictures) for fun, I pushed that aside, then some visual stuff started appearing against my will towards the end, but I was able to remove that too.</p><p>I also swallowed saliva 2 more times, for me it's a signal of concentration weakening. I felt anger about it and anger about the anger, but it seems like after that no such impulses arose and I kind of sorted it out, there was no compulsive attention to saliva. I started pressing my tongue to the roof of my mouth and I think that's what helped, I knew about this technique but I avoided it because of some not-so-great associations, since I learned about this technique in a place I don't like.</p><p>The journalist was there too, of course, but he doesn't piss me off as much anymore and there was way less of him, can't compare to day 1. And I'm even thinking I might find some use in him. In this meditation I understood that his chatter actually exists to support my ego (it doesn't always help, if anything the fact of his chatter undermines my "meditative self-esteem," but he tries), and exactly when my ego isn't hurting, meditating is way easier. And right now it's hurting a little because of the fact that there's an external observer of my practice.</p></div></article>
                                <article class="day-entry"><div class="day-header"><span class="day-date">May 22</span><span class="day-status status-done">meditation done</span><span class="day-divider"></span></div><div class="day-text"><p>This time my goal was also just not to look at the timer and I did it. The journalist was there, but his voice is getting less vivid, and he wasn't so much praising me as just describing what was happening. Or maybe there just wasn't anything outstanding in this meditation, just an ordinary, average meditation without suffering and without breakthroughs.</p><p>Overall my mind was chaotic, it kept grabbing onto different subtle phenomena for concentration (catching random vibrations), moving from one to another when it got bored. A couple of times some thoughts not even about the meditation process, just from life, flickered by. I didn't try very hard, since my goal was really just not to look at the timer. And it seems I didn't have the resources for a quality meditation. I still think my difficulties are mainly because I don't understand the subtleties of the meditation technique in this system, that's why I grab onto different things and don't know what to orient myself towards or what to aim for.</p></div></article>
                                <article class="day-entry"><div class="day-header"><span class="day-date">May 23</span><span class="day-status status-done">meditation done</span><span class="day-divider"></span></div><div class="day-text"><p>At first it was a neutral meditation, then I started feeling anxiety that someone might unexpectedly come into my room while I'm in such a vulnerable state (I wasn't home alone), because of that I looked at the time after 20 minutes. And even 2 or 3 times. And overall, after the meditation the anxiety intensified and I became a bit furious in general. I think it's a reaction to a boundary violation or a desire to expand and strengthen them. Because when I think about plans regarding this, I calm down a little.</p></div></article>
                                <article class="day-entry"><div class="day-header"><span class="day-date">May 24</span><span class="day-status status-done">meditation done</span><span class="day-divider"></span></div><div class="day-text"><p>The impulse to check the time came up (about 5 not very strong impulses), but I overcame them. There was a moment I hadn't encountered in the days before: I caught a semi-trance state, and there was a possibility to go deeper, to dive in, but that's when the timer became an obstacle again, only differently: "what's the point of going into a deep state, the timer will just go off and ruin everything anyway." I felt the timer almost with my skin, almost as a physical obstruction, it even visualized itself as a barrier. After that there were also thoughts that if a meditation has a timer, then it's fake, and nothing good can come of it. That was just a thought, but overall it was a fairly easy, good meditation, and its distinctive feature was that in it I didn't torture myself as much as in the past days, it was even a rest, a refuge, and here's from what:</p><p>So basically, as soon as I more or less started to cope with this pattern of torment from the timer and the external observer in meditation, it formed in my life at a complexity ratio of 1 to 1000. And now I'm writing from inside this process. In short, now I'm suffering not just from the timer, but from all of time in general, and I've got not just an observer of my meditation (the mentor), but a physical observer in the house. Because of this I can't fall asleep, actually it's been 2 nights already. In general insomnia isn't very typical for me, I suffer from it maybe a couple of nights a year. But I'm afraid of insomnia and consider sleep the most important thing in life, and that seems to complicate everything as well.</p><p>Right now it all feels like that wild desire to check the timer in the first days of the program, only there's no timer and nothing to check, and the observer also can't really do anything to me, this is all a game of my psyche that I can't get out of for now. It's just that in meditation I kind of learned "not to check," but here I still can't understand what exactly I'm not supposed to check.</p><p>Just for the record, I don't have OCD. This is a reaction to a trigger — to time limits and to the presence of an observer in a space I consider intimate.</p><p>I understand this entry might look quite intense, but I hope it won't cause fear for me. I'll cope with this and I don't need any special help. For me this is far from the highest level of intensity I've faced. I'm describing everything as it is because it affects my practice and seems important for understanding my situation.</p></div></article>
                            </div>
                            <div class="sub-panel" id="sub-panel-week2">
                                <article class="day-entry"><div class="day-header"><span class="day-date">May 25</span><span class="day-status status-done">meditation done</span><span class="day-divider"></span></div><div class="day-text"><p>Attempt 1, no good. About 13 minutes. I was doing it in not the most comfortable conditions. Lots of noise, not enough privacy, because of that I couldn't take it, looked at the time and couldn't continue anymore. I knew it was all gonna be hard, but I was trying so hard to practice meditating in crappy conditions. There was this pleasant sound of a humming fridge, would've been nice to meditate to it, but I had this anxiety like "why tune into it if it's about to stop humming", so that didn't save me.</p><p>Attempt 2. A pleasant, good meditation. Spent a lot of time in a meditative, half-trance state, slipping into an 80% trance for moments. Felt kind towards the journalist 'cause I think I got his essence. Catching the "vibration" was super easy, usually I have to listen closely, kinda strain for it, but here it was almost like a normal sound (still disappeared when coming out of the meditative state though). Wanted to check the timer, but the impulses weren't too strong. There were bird sounds, a bit distracting, but still not too bad.</p></div></article>
                                <article class="day-entry"><div class="day-header"><span class="day-date">May 26</span><span class="day-status status-done">meditation done</span><span class="day-divider"></span></div><div class="day-text"><p>Normal, ordinary meditation. Don't even feel like writing anything.</p></div></article>
                                <article class="day-entry"><div class="day-header"><span class="day-date">May 27</span><span class="day-status status-done">meditation done</span><span class="day-divider"></span></div><div class="day-text"><p>Well, fine. Haven't been checking the time all this week. Wanted to, but not too much. The mind was chaotic — couldn't focus on anything, just bounced from vibration to vibration. It was a meditative state, but a low-quality one.</p></div></article>
                                <article class="day-entry"><div class="day-header"><span class="day-date">May 28</span><span class="day-status status-done">meditation done</span><span class="day-divider"></span></div><div class="day-text"><p>Fine. Actually, the overall quality hasn't really changed since last week, what's changed is that I take this whole thing and all the distractions more lightly, put less pressure on myself. And with the journalist, I don't argue or try to make him shut up, I just say back to his words "help me meditate". 'Cause I do think that overall he exists to help me, he just needs to be guided. 3 minutes before the timer went off, I looked at it 'cause I thought I heard the timer ring. What motivates me to concentrate — in a good meditative state it's super easy to sit for 30 minutes, and without it — it's hard. I can say there was no torment in this meditation at all, even though there were lots of not-ideal moments and jumps in concentration.</p></div></article>
                                <article class="day-entry"><div class="day-header"><span class="day-date">May 29</span><span class="day-status status-done">meditation done</span><span class="day-divider"></span></div><div class="day-text"><p>Fine. The unusual part — legs went numb and nose itched. It was noticeable, but I didn't react. Thought maybe it's the psyche's resistance before some new discovery in meditation, which might come in the future. After the timer, for the first time in these days, I didn't want to come out of meditation. Caught a pleasant concentration. Tried to train centering my attention. Still, these vibrations make my attention wander off in different directions.</p></div></article>
                                <article class="day-entry"><div class="day-header"><span class="day-date">May 30</span><span class="day-status status-done">meditation done</span><span class="day-divider"></span></div><div class="day-text"><p>Didn't hear the timer and accidentally meditated for 50 minutes. I was meditating at night, towards morning. And through my closed eyelids I noticed it had gotten way too light, so that's how I decided to check the timer and ended the meditation.</p></div></article>
                                <article class="day-entry"><div class="day-header"><span class="day-date">May 31</span><span class="day-status status-done">meditation done</span><span class="day-divider"></span></div><div class="day-text"><p>Pleasant meditation, but more of a foggy feeling than clarity. Today is already the 3rd day in a row with minor unpleasant physical sensations. Something on my face was itching. But overall it didn't bother me and I didn't try to scratch.</p></div></article>
                            </div>
                            <div class="sub-panel" id="sub-panel-week3">
                                <article class="day-entry"><div class="day-header"><span class="day-date">June 1</span><span class="day-status status-done">meditation done</span><span class="day-divider"></span></div><div class="day-text"><p>Normal meditation. But afterward I realized I had lost interest in tracking various distraction phenomena during the process. Some distraction happens — like swallowing saliva — and I just don’t care. It seems I don’t even notice most of these distractions anymore. I don’t know how to relate to this or how it affects the quality of meditation. On one hand, it feels quieter in my head, the inner voices are almost gone. On the other hand, maybe I’ve just started noticing less and in reality my meditation has simply gotten worse, only I don’t know about it? Instead of the journalist voice today there was a lot of visual stuff, basically like dreams, a movie inside. I managed to pull myself out of them, but they kept appearing again and again.</p></div></article>
                                <article class="day-entry"><div class="day-header"><span class="day-date">June 2</span><span class="day-status status-done">meditation done</span><span class="day-divider"></span></div><div class="day-text"><p>Usual meditation. There were quite bright “vibrations,” but no deep trance. The journalist is almost completely gone. At some point my nose started itching really strongly. I would like to figure out this phenomenon. Maybe it anticipates a new level of relaxation, itches to attract attention, who knows. Of course when I come out of meditation it stops itching. I can’t say it prevents me from meditating, but it starts itching very intensely.</p><p>Right now I’m afraid I’ve fallen into a trap of mental dullness. And I’ve been there for several days already. Sweet degradation. Still don’t know how to get out of it. I think now that I no longer care about the timer, the journalist, etc., I have the right to give myself more difficult tasks in meditation. And right now that is — to keep a sharp mind and not allow fog.</p></div></article>
                                <article class="day-entry"><div class="day-header"><span class="day-date">June 3</span><span class="day-status status-done">meditation done</span><span class="day-divider"></span></div><div class="day-text"><p>First attempt — 20 minutes. I meditated during the day and again couldn’t do it. The meditation was difficult and heavy, there were distracting factors. I couldn’t hold out for 30 minutes. It really felt like enduring.</p><p>Second attempt — successful, 30 minutes. I didn’t feel like meditating, but I still did it so the days wouldn’t reset. And yet I liked this meditation, it was pleasant. In the beginning there was a feeling of rush, like I had to run somewhere. But I caught that feeling and, on the contrary, when it appeared I relaxed myself even more. I convinced myself that the slower I go, the faster this time would pass. And that’s exactly what happened. I wasn’t trying too hard, but there was no viscosity or fog, there was clarity. Only toward the end hypnagogic images appeared again, intrusive ones. I tried to stop them but new ones kept coming. There were clearly some plots there, but nothing too complex, and I can’t remember them now.</p></div></article>
                                <article class="day-entry"><div class="day-header"><span class="day-date">June 4</span><span class="day-status status-done">meditation done</span><span class="day-divider"></span></div><div class="day-text"><p>I meditated for 30 minutes. Honestly I didn’t keep a diary that day and I’m writing this afterward.</p></div></article>
                                <article class="day-entry"><div class="day-header"><span class="day-date">June 5</span><span class="day-status status-done">meditation done</span><span class="day-divider"></span></div><div class="day-text"><p>Meditated 30 minutes.</p></div></article>
                                <article class="day-entry"><div class="day-header"><span class="day-date">June 6</span><span class="day-status status-done">meditation done</span><span class="day-divider"></span></div><div class="day-text"><p>Meditated 30 minutes.</p></div></article>
                                <article class="day-entry"><div class="day-header"><span class="day-date">June 7</span><span class="day-status status-done">meditation done</span><span class="day-divider"></span></div><div class="day-text"><p>I had little motivation for meditation and I’m even afraid of losing it. The initial charge is behind me. Despite the feeling of losing motivation, meditation already feels like a routine. About the meditation: it wasn’t bad, but it wasn’t strong stable concentration either. The only expectation I had of myself was to stay in place and not get too involved in thoughts. The whole meditation felt like I was trying to seat myself in place instead of running after time. I even visualized huge hands pressing me against the wall so I would stay put. Maybe thanks to this I felt the so-called grounding for the first time during this marathon. Usually during meditation I’m clearly somewhere outside myself. Again there was strong itching on the tip of the right side of my nose, which seemed to crawl along a line toward the outer corner of the eye. This is not ordinary itching. It is very intense and precise, but I can’t call it unpleasant. There were also beginnings of it symmetrically on the other side of the nose, but it didn’t spread across the cheek there.</p></div></article>

                                <div class="day-text">
                                    <p><strong>Sigil of Loki.</strong> I started thinking about Loki during that same “bad trip” with insomnia last week. But that’s a separate big story. I decided to make a sigil dedicated to him.</p>
                                    <p>This is an artifact made of polymer clay, into which I embedded an NFC chip; I wear it as a pendant around my neck. When you tap your phone to the pendant, it opens a cyber‑temple of Loki, which I also made myself.</p>
                                    <div class="sigil-section"><h4><span class="section-icon">✦</span> Pendant</h4><p>I didn’t think much about symbolism while creating it, but I decided to describe what I saw once it was finished:</p><blockquote class="sigil-quote">“I see vitality and childishness in it. It’s a candy. And it’s a painting with pronounced brushstrokes. And it’s unclear whether it reflects emergence or decline. Overall, you could see it as both. You could see it as a top‑down view of a planet towards which a fiery vortex is rushing, or a planet that is the source of this vortex. But one thing is clear: the entire space it occupies at this moment is fire. On the one hand, swift and consuming; on the other, somehow very structured, as it is in the shape of a perfect spiral. And the dots forming a circle somehow hint that this is a ready‑made system, thought out and self‑producing. But not all dots are visible. Everything can be seen only if you look closely. And this means that the system, although it exists, is not obvious at first glance. Or maybe it’s not a planet, but air from which the fire emerges? Or water with which it ends?”</blockquote></div>
                                    <div class="sigil-section"><h4><span class="section-icon">✦</span> Cyber‑Temple</h4><p>Same with the cyber‑temple. I didn’t really think about symbolism; I just had fun making it. If you’re curious, you can freely visit it:</p><a href="https://wiobip.github.io/loki/" target="_blank" class="sigil-link">🌐 Enter the Temple of Loki</a><blockquote class="sigil-quote">“The pendant contrasts quite strongly with the cyber‑temple. The temple is dramatic, gloomy. But funny. It wants to touch feelings and play with vulnerabilities, fear of death, hopelessness, and helplessness. But still, it’s actually happy to see a visitor. In its irony and sarcasm, you can feel sparks of joy.”</blockquote></div>
                                    <div class="sigil-section"><h4><span class="section-icon">✦</span> Future Layers</h4><p>In the future, I might make new layers of the cyber‑temple, which could be accessed through certain click combinations on the page or through secret codes that need to be entered.</p></div>
                                </div>

            <script>
                (function() {
                    const canvas = document.getElementById('sparkle-canvas');
                    const ctx = canvas.getContext('2d');
                    let width, height;
                    const particles = [];
                    const MAX_PARTICLES = 90;
                    const sparkleColors = ['rgba(255,255,255,','rgba(255,250,240,','rgba(240,215,180,','rgba(255,245,220,','rgba(220,195,240,','rgba(245,230,255,','rgba(255,240,210,','rgba(200,175,220,'];
                    function resize() { width = window.innerWidth; height = window.innerHeight; canvas.width = width; canvas.height = height; }
                    function createParticle() {
                        const colorBase = sparkleColors[Math.floor(Math.random() * sparkleColors.length)];
                        return { x: Math.random()*width, y: Math.random()*height, size: Math.random()*2.8+0.6, baseOpacity: Math.random()*0.7+0.3, opacity:0, colorBase: colorBase, twinkleSpeed: Math.random()*0.025+0.008, twinkleOffset: Math.random()*Math.PI*2, lifePhase: Math.random()*Math.PI*2, driftX: (Math.random()-0.5)*0.15, driftY: (Math.random()-0.5)*0.2-0.08, maxOpacity: Math.random()*0.7+0.3 };
                    }
                    function initParticles() {
                        particles.length = 0;
                        for (let i=0; i<MAX_PARTICLES; i++) { const p = createParticle(); p.lifePhase = (i/MAX_PARTICLES)*Math.PI*2; p.opacity = p.maxOpacity*(0.3+0.7*Math.abs(Math.sin(p.lifePhase))); particles.push(p); }
                    }
                    function updateParticles() {
                        for (const p of particles) {
                            p.lifePhase += p.twinkleSpeed; const sineVal = Math.sin(p.lifePhase+p.twinkleOffset);
                            p.opacity = p.maxOpacity*(0.15+0.85*((sineVal+1)/2)); p.x += p.driftX; p.y += p.driftY;
                            if (p.x<-10) p.x=width+10; if (p.x>width+10) p.x=-10; if (p.y<-10) p.y=height+10; if (p.y>height+10) p.y=-10;
                            if (Math.random()<0.0003) { const fresh = createParticle(); p.x=fresh.x; p.y=fresh.y; p.size=fresh.size; p.maxOpacity=fresh.maxOpacity; p.colorBase=fresh.colorBase; p.twinkleSpeed=fresh.twinkleSpeed; p.driftX=fresh.driftX; p.driftY=fresh.driftY; }
                        }
                    }
                    function drawParticles() {
                        ctx.clearRect(0,0,width,height);
                        for (const p of particles) {
                            if (p.opacity<0.02) continue; const alpha = p.opacity; const color = p.colorBase+alpha+')';
                            if (p.size>1.6 && alpha>0.35) {
                                const cx=p.x, cy=p.y, s=p.size*1.8, glow=p.size*3.5;
                                const glowGrad = ctx.createRadialGradient(cx,cy,0,cx,cy,glow);
                                glowGrad.addColorStop(0, p.colorBase+(alpha*0.7)+')'); glowGrad.addColorStop(0.5, p.colorBase+(alpha*0.2)+')'); glowGrad.addColorStop(1,'rgba(0,0,0,0)');
                                ctx.fillStyle=glowGrad; ctx.beginPath(); ctx.arc(cx,cy,glow,0,Math.PI*2); ctx.fill();
                                ctx.fillStyle=color; ctx.beginPath(); ctx.moveTo(cx,cy-s); ctx.lineTo(cx+s*0.35,cy); ctx.lineTo(cx,cy+s); ctx.lineTo(cx-s*0.35,cy); ctx.closePath(); ctx.fill();
                                ctx.fillStyle=p.colorBase+(alpha*0.65)+')'; ctx.beginPath(); ctx.moveTo(cx-s*0.55,cy); ctx.lineTo(cx+s*0.55,cy); ctx.lineTo(cx,cy+s*0.15); ctx.lineTo(cx,cy-s*0.15); ctx.closePath(); ctx.fill();
                            } else {
                                const glowGrad = ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.size*2.5);
                                glowGrad.addColorStop(0, p.colorBase+alpha+')'); glowGrad.addColorStop(1,'rgba(0,0,0,0)');
                                ctx.fillStyle=glowGrad; ctx.beginPath(); ctx.arc(p.x,p.y,p.size*2.5,0,Math.PI*2); ctx.fill();
                                ctx.fillStyle=color; ctx.beginPath(); ctx.arc(p.x,p.y,p.size,0,Math.PI*2); ctx.fill();
                            }
                        }
                    }
                    function animate() { updateParticles(); drawParticles(); requestAnimationFrame(animate); }
                    window.addEventListener('resize', ()=>{ resize(); initParticles(); });
                    resize(); initParticles(); animate();
                })();

                (function() {
                    const canvas = document.getElementById('sparkle-cursor-canvas');
                    const ctx = canvas.getContext('2d');
                    let width, height, mouseX=-200, mouseY=-200; const trail = []; let particles = []; const MAX=150, LIFE=45;
                    const palette = ['#f9e6cf','#f5d7b0','#ebcfa0','#e8d5f5','#d9c0f0','#cbb5e8','#fce1e8','#fdd0dc','#ffffff','#f7f3f0'];
                    let overCard = false;
                    function resize() { width=window.innerWidth; height=window.innerHeight; canvas.width=width; canvas.height=height; }
                    window.addEventListener('resize', resize); resize();
                    function isOverContentWrapper(x,y) { const el = document.elementFromPoint(x,y); return el && el.closest('.content-wrapper'); }
                    window.addEventListener('mousemove', e => {
                        mouseX=e.clientX; mouseY=e.clientY; overCard=isOverContentWrapper(mouseX,mouseY);
                        trail.push({x:mouseX, y:mouseY, age:0}); if (trail.length>35) trail.shift();
                    });
                    window.addEventListener('touchmove', e => {
                        if (e.touches.length) { mouseX=e.touches[0].clientX; mouseY=e.touches[0].clientY; overCard=isOverContentWrapper(mouseX,mouseY); trail.push({x:mouseX, y:mouseY, age:0}); if (trail.length>35) trail.shift(); }
                    });
                    function spawn() {
                        if (overCard) return; let cnt=3;
                        if (trail.length>1) { const last=trail[trail.length-1], prev=trail[Math.max(0,trail.length-3)]; const d=Math.hypot(last.x-prev.x, last.y-prev.y); if (d>8) cnt=5; else if (d>3) cnt=4; }
                        for (let i=0; i<cnt; i++) { if (particles.length>=MAX) break; const idx = Math.max(0, trail.length-1-Math.floor(Math.random()*4)); const base = trail[idx] || {x:mouseX, y:mouseY}; const ang=Math.random()*Math.PI*2, rad=Math.random()*20+4;
                            particles.push({ x:base.x+Math.cos(ang)*rad, y:base.y+Math.sin(ang)*rad, vx:(Math.random()-0.5)*1.2, vy:(Math.random()-0.8)*1.5-0.8, life:LIFE, maxLife:LIFE, size:Math.random()*2.8+1.2, color:palette[Math.floor(Math.random()*palette.length)] }); }
                    }
                    function updateParticles() { for (let i=trail.length-1; i>=0; i--) { trail[i].age++; if (trail[i].age>18) trail.splice(i,1); } for (let i=particles.length-1; i>=0; i--) { const p=particles[i]; p.x+=p.vx; p.y+=p.vy; p.vy+=0.03; if (overCard) p.life-=2; else p.life-=1; if (p.life<=0 || p.y>height+30 || p.x<-30 || p.x>width+30) particles.splice(i,1); } spawn(); if (particles.length>MAX) particles=particles.slice(-MAX); }
                    function drawParticles() {
                        ctx.clearRect(0,0,width,height);
                        for (const p of particles) { const ratio=p.life/p.maxLife, alpha=Math.min(ratio*1.3,0.9), size=p.size*(0.4+ratio*0.6); ctx.save(); ctx.globalAlpha=alpha; ctx.fillStyle=p.color; ctx.shadowColor=p.color; ctx.shadowBlur=size*2.5;
                            if (size>1.6) { const cx=p.x, cy=p.y; ctx.beginPath(); ctx.moveTo(cx,cy-size); ctx.lineTo(cx+size*0.3,cy-size*0.2); ctx.lineTo(cx+size*0.8,cy); ctx.lineTo(cx+size*0.3,cy+size*0.2); ctx.lineTo(cx,cy+size); ctx.lineTo(cx-size*0.3,cy+size*0.2); ctx.lineTo(cx-size*0.8,cy); ctx.lineTo(cx-size*0.3,cy-size*0.2); ctx.closePath(); ctx.fill(); }
                            else { ctx.beginPath(); ctx.arc(p.x,p.y,size*0.8,0,Math.PI*2); ctx.fill(); } ctx.restore(); }
                        if (mouseX>0) { ctx.save(); const grd=ctx.createRadialGradient(mouseX,mouseY,1,mouseX,mouseY,14); grd.addColorStop(0,'rgba(255,245,220,0.9)'); grd.addColorStop(0.5,'rgba(240,210,180,0.4)'); grd.addColorStop(1,'rgba(200,160,200,0)'); ctx.fillStyle=grd; ctx.shadowColor='#fce5c0'; ctx.shadowBlur=18; ctx.beginPath(); ctx.arc(mouseX,mouseY,14,0,2*Math.PI); ctx.fill(); ctx.fillStyle='#fffef7'; ctx.shadowBlur=12; const s=5; ctx.beginPath(); ctx.moveTo(mouseX,mouseY-s); ctx.lineTo(mouseX+s*0.4,mouseY-s*0.3); ctx.lineTo(mouseX+s,mouseY); ctx.lineTo(mouseX+s*0.4,mouseY+s*0.3); ctx.lineTo(mouseX,mouseY+s); ctx.lineTo(mouseX-s*0.4,mouseY+s*0.3); ctx.lineTo(mouseX-s,mouseY); ctx.lineTo(mouseX-s*0.4,mouseY-s*0.3); ctx.closePath(); ctx.fill(); ctx.restore(); }
                        }
                        function animate() { updateParticles(); drawParticles(); requestAnimationFrame(animate); }
                        animate();
                    })();

                    function bindTabEvents(btns) { btns.forEach(btn => { if (btn.classList.contains('more-btn')) return; btn.addEventListener('click', () => { const tab = btn.dataset.tab; document.querySelectorAll('.tab-btn, .more-dropdown .tab-btn').forEach(b => b.classList.remove('active')); document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active')); btn.classList.add('active'); const panel = document.getElementById(`panel-${tab}`); if (panel) panel.classList.add('active'); document.getElementById('moreDropdown')?.classList.remove('open'); }); }); }
                    (function() {
                        const container = document.getElementById('tabNavContainer'); const mainNav = document.getElementById('mainTabNav'); const moreWrapper = document.getElementById('moreTabsWrapper'); const moreDropdown = document.getElementById('moreDropdown'); const moreBtn = document.getElementById('moreBtn'); const sourceTabs = document.querySelectorAll('#allTabsSource .tab-btn');
                        const tabClones = Array.from(sourceTabs).map(btn => { const c = btn.cloneNode(true); c.classList.remove('active'); return c; });
                        function arrangeTabs() {
                            mainNav.innerHTML=''; moreDropdown.innerHTML=''; const containerWidth = container.clientWidth; let totalWidth=0; const visible=[], hidden=[];
                            const temp = document.createElement('div'); temp.style.cssText='display:flex;gap:6px;visibility:hidden;position:absolute;'; document.body.appendChild(temp);
                            tabClones.forEach(clone => { const t=clone.cloneNode(true); temp.appendChild(t); const w = t.offsetWidth+6; totalWidth+=w; if (totalWidth < containerWidth-100) visible.push(clone); else hidden.push(clone); });
                            document.body.removeChild(temp); visible.forEach(c => mainNav.appendChild(c.cloneNode(true)));
                            if (hidden.length>0) { moreWrapper.style.display='block'; hidden.forEach(c => moreDropdown.appendChild(c.cloneNode(true))); } else moreWrapper.style.display='none';
                            const activeTabId = document.querySelector('.tab-panel.active')?.id?.replace('panel-','');
                            if (activeTabId) { document.querySelectorAll('.tab-btn').forEach(b => { if (b.dataset.tab===activeTabId) b.classList.add('active'); else b.classList.remove('active'); }); }
                            bindTabEvents(document.querySelectorAll('.tab-btn'));
                        }
                        moreBtn.addEventListener('click', e => { e.stopPropagation(); moreDropdown.classList.toggle('open'); });
                        document.addEventListener('click', e => { if (!moreDropdown.contains(e.target) && e.target!==moreBtn) moreDropdown.classList.remove('open'); });
                        window.addEventListener('resize', arrangeTabs); arrangeTabs();
                    })();

                    (function() {
                        const allSubBtns = document.querySelectorAll('.sub-tab-btn');
                        allSubBtns.forEach(btn => {
                            btn.addEventListener('click', () => {
                                const subtab = btn.dataset.subtab;
                                const parent = btn.closest('.tab-panel');
                                if (!parent) return;
                                const subBtns = parent.querySelectorAll('.sub-tab-btn');
                                const subPanels = parent.querySelectorAll('.sub-panel');
                                subBtns.forEach(b => b.classList.remove('active'));
                                subPanels.forEach(p => p.classList.remove('active'));
                                btn.classList.add('active');
                                const targetPanel = document.getElementById(`sub-panel-${subtab}`);
                                if (targetPanel) targetPanel.classList.add('active');
                            });
                        });
                    })();
            </script>

    <script>
        const loginBox = document.getElementById('loginBox');
        const passwordInput = document.getElementById('passwordInput');
        const unlockBtn = document.getElementById('unlockBtn');
        const errorMsg = document.getElementById('errorMsg');
        const template = document.getElementById('diaryTemplate');

        function unlock() {
            const pwd = passwordInput.value.trim();
            if (pwd !== 'wry') {
                errorMsg.classList.add('show');
                passwordInput.value = '';
                return;
            }
            // Берём содержимое template и заменяем им весь документ
            const clone = template.content.cloneNode(true);
            // Очищаем body и вставляем клонированный дневник
            document.body.innerHTML = '';
            document.body.appendChild(clone);
        }

        unlockBtn.addEventListener('click', unlock);
        passwordInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') unlock();
        });
    </script>
