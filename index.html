<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✦ Sealed Grimoire</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #140624;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Cinzel', Georgia, serif;
            cursor: default;
            overflow: hidden;
        }
        .login-background {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background:
                radial-gradient(ellipse at 30% 20%, rgba(100, 50, 140, 0.4) 0%, transparent 55%),
                radial-gradient(ellipse at 70% 60%, rgba(60, 30, 110, 0.35) 0%, transparent 55%),
                radial-gradient(ellipse at 40% 80%, rgba(130, 80, 170, 0.3) 0%, transparent 50%);
            z-index: 0;
        }
        .login-box {
            position: relative;
            z-index: 1;
            background: rgba(20, 6, 36, 0.7);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(212, 168, 83, 0.5);
            border-radius: 24px;
            padding: 3rem 2.5rem;
            text-align: center;
            box-shadow: 0 0 60px rgba(160, 120, 200, 0.4);
            width: 90%;
            max-width: 420px;
        }
        .login-box h2 {
            color: #e8c97a;
            font-weight: 600;
            letter-spacing: 0.08em;
            margin-bottom: 2rem;
            text-shadow: 0 0 15px rgba(232,201,122,0.7);
            font-size: 1.6rem;
        }
        .login-box input {
            width: 100%;
            padding: 14px 20px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(180,150,210,0.5);
            border-radius: 30px;
            color: #e8c97a;
            font-family: 'Cinzel', serif;
            font-size: 1rem;
            letter-spacing: 0.05em;
            text-align: center;
            outline: none;
            transition: all 0.3s;
        }
        .login-box input:focus {
            border-color: #e8c97a;
            box-shadow: 0 0 20px rgba(232,201,122,0.5);
        }
        .login-box button {
            margin-top: 1.8rem;
            background: transparent;
            border: 1px solid #e8c97a;
            color: #e8c97a;
            padding: 12px 36px;
            font-family: 'Cinzel', serif;
            font-size: 0.9rem;
            letter-spacing: 0.12em;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
        }
        .login-box button:hover {
            background: rgba(232,201,122,0.15);
            box-shadow: 0 0 25px rgba(232,201,122,0.6);
        }
        .error {
            color: #c0a0a0;
            font-size: 0.8rem;
            margin-top: 1rem;
            display: none;
        }
        .error.show { display: block; }
    </style>
</head>
<body>
    <div class="login-background"></div>
    <div class="login-box" id="loginBox">
        <h2>✦ Speak the Word ✦</h2>
        <input type="password" id="passwordInput" placeholder="Enter the password" />
        <button id="unlockBtn">Unseal Grimoire</button>
        <div class="error" id="errorMsg">The seal remains unbroken…</div>
    </div>

            function tryDecrypt() {
                const password = passwordInput.value.trim();
                if (!password) return;

                if (password !== 'wry') {
                    errorMsg.classList.add('show');
                    passwordInput.value = '';
                    return;
                }

                try {
                    const bytes = CryptoJS.AES.decrypt(encryptedWry, password);

                    scripts.forEach(oldScript => {
                        const newScript = document.createElement('script');
                        Array.from(oldScript.attributes).forEach(attr => {
